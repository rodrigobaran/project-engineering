name: ci

# Roda em todo PR e em todo push na main. Sem pull_request_target: o código de um PR nunca roda com
# acesso de escrita nem com secrets de outro contexto. Actions fixadas por SHA de commit, não por tag.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Pessoas que podem assinar commit aqui (N11). Merge pela web tem committer GitHub, aceito pelo check.
  PESSOAS: "44187020+rodrigobaran@users.noreply.github.com"
  BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
  TOPO: ${{ github.event.pull_request.head.sha || github.event.after }}

jobs:
  testes:
    name: testes (${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --require-hashes --no-deps -r .github/requisitos-ci.txt
      - run: scripts/verificar
      - run: scripts/testar

  autoria:
    name: autoria (N11)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Só biblioteca padrão: o python3 do runner (3.12) basta.
      - run: python3 -m fabrica autoria . --intervalo "$BASE..$TOPO" --pessoa "$PESSOAS"

  termos:
    name: termos proibidos
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Título e corpo do PR são lidos do payload do evento pelo Python, nunca interpolados no script:
      # interpolar texto de PR dentro de `run:` é injeção de comando.
      - env:
          TERMOS_PROIBIDOS: ${{ secrets.TERMOS_PROIBIDOS }}
        run: python3 -m fabrica termos . --intervalo "$BASE..$TOPO" --evento "$GITHUB_EVENT_PATH"
